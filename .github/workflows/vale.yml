name: Vale Linting

# This workflow only runs Vale and uploads the results as an artifact.
# It runs with a read-only token, which is all that fork PRs get.
# Posting review comments happens in vale-comment.yml, which runs in the
# base repo context after this workflow finishes.

# Trigger on PRs that change Markdown files (but skip run on draft PRs)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'content/en/docs/**/*.md'

permissions:
  contents: read
  pull-requests: read

jobs:
  vale:
    # Only run on Mendix repo, not forks, and not on draft PRs
    if: (github.repository_owner == 'mendix' || github.repository_owner == 'dbreseman') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.26.0
    # Cancel old runs when new commits are pushed
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .vale.ini
            .vale
            content/en/docs
          sparse-checkout-cone-mode: false

      - name: Get changed files
        id: changed-files
        run: |
          mkdir -p vale-results
          echo "${{ github.event.pull_request.number }}" > vale-results/pr-number
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate --jq '.[] | select(.status != "removed") | .filename' | { grep '^content/en/docs/.*\.md$' || true; } > changed-files.txt
          : > vale-results/results.rdjsonl
          if [ -s changed-files.txt ]; then echo "has_files=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Vale
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          ARCHIVE="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          BASE_URL="https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$BASE_URL/$ARCHIVE"
          curl -sSfLO "$BASE_URL/vale_${VALE_VERSION}_checksums.txt"
          # Verify the download against the checksum published with the release
          grep " $ARCHIVE\$" "vale_${VALE_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/bin/vale" sync

      - name: Run Vale
        run: |
          if [ -s changed-files.txt ]; then
            # Only flag errors, not warnings or suggestions. Vale exits non-zero on errors; that is expected.
            xargs -d '\n' vale --output=JSON --minAlertLevel=error < changed-files.txt > vale.json || true
            # Convert Vale JSON to reviewdog's rdjsonl format
            jq -c 'to_entries[] | .key as $f | .value[] | {message: ("[" + .Check + "] " + .Message), location: {path: $f, range: {start: {line: .Line, column: .Span[0]}}}, severity: (.Severity | ascii_upcase)}' vale.json > vale-results/results.rdjsonl
          fi

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: vale-results
          path: vale-results/
          retention-days: 3
